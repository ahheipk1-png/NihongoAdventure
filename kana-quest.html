/* ============================================================
   11. SESSION
   ============================================================ */

function startSession(p, mode) {
  stopLoops();
  lastPrompt = null;
  const info = levelInfo(p);
  const full = boardPool(p);
  const five = pickFive(p, full);
  save();

  session = {
    mode: mode, level: info, pool: five, levelPool: full, levelUp: null,
    usedThisRound: five.slice(), boards: 0,
    total: 0, hits: 0, streak: 0, best: 0,
    marks: [], missed: {}, locked: false, answeredWrongHere: false,
    q: null, raf: null, powerRaf: null, timer: null
  };
  powerInit(p, mode);

  if (mode === "match") { session.q = buildQuestion(p); go("match"); }
  if (mode === "pairs") { setupPairs(p); go("pairs"); }
  if (mode === "fruit") { setupFruit(p); go("fruit"); }
  if (mode === "word")  { setupWord(p);  go("word");  }
  if (mode === "fish")  { setupFish(p);  go("fish");  }
  startPowerClock(p);
}

function credit(p, kana, right) {
  bump(p, kana, right);
  if (right) {
    session.hits += 1;
    session.streak += 1;
    session.best = Math.max(session.best, session.streak);
    p.stars += 1;
  } else {
    session.streak = 0;
    session.missed[kana] = true;
  }
  save();
}

function finish(p) {
  stopLoops();
  if (session) session.levelUp = advanceLevel(p);
  save();
  go("result");
}

/* ---------- MATCH ---------- */

function buildQuestion(p) {
  const t = tierOf(p);
  const answer = nextKana(p, session.pool, lastPrompt);
  lastPrompt = answer;
  const fm = pickForms(p);
  const typing = p.typing && t.dakuten && courseOf(p).kind === "kana" && fm.to === "romaji";
  const options = shuffle([answer].concat(distractors(p, answer, t.choices - 1, session.pool, fm.to)));
  return { answer: answer, from: fm.from, to: fm.to, typing: typing, options: options };
}

function stripHTML() {
  const pips = [];
  for (let i = 0; i < session.quota; i++) {
    pips.push('<span class="pip ' + (i < session.score ? "hit" : i === session.score ? "now" : "") + '"></span>');
  }
  return '<div class="strip"><div class="pips">' + pips.join("") + '</div>' +
         (session.streak > 1 ? '<span class="streak">🔥 ' + session.streak + '</span>' : '') + '</div>';
}

function renderMatch(p) {
  const t = tierOf(p);
  const q = session.q;
  const promptText = showForm(p, q.answer, q.from);
  const promptCls = isJpForm(q.from) ? "" : " romaji";
  const hint = courseOf(p).kind === "grammar" ? (itemOf(p, q.answer).en || "") : "";
  const asSentence = promptText.length > 7;
  const askLabel = q.to === "en" ? "What does this mean?"
                 : isJpForm(q.to) ? "Which one is this?"
                 : "What sound is this?";

  const answersHTML = q.typing
    ? '<form class="typebox" id="typeForm">' +
        '<label class="sr" for="typeIn">Type the sound</label>' +
        '<input id="typeIn" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="type the sound">' +
        '<button class="btn btn-primary" type="submit">Check</button></form>'
    : '<div class="answers" data-n="' + t.choices + '">' +
        q.options.map(function (k, i) {
          const lab = showForm(p, k, q.to);
          return '<button class="ans ' + formClass(q.to) + (lab.length > 6 ? " long" : "") +
                 '" data-k="' + k + '">' +
                 '<span class="key">' + (i + 1) + '</span>' + esc(showForm(p, k, q.to)) + '</button>';
        }).join("") + '</div>';

  screenEl.innerHTML =
    '<div class="stack">' +
      unlockBanner() +
      '<div class="row">' + boardTag() + '</div>' +
      powerHUD() +
      stripHTML() +
      '<div class="sheet stack" style="align-items:center;gap:18px">' +
        '<span class="eyebrow">' + (hint ? "Fill the gap" : askLabel) + '</span>' +
        (asSentence
          ? '<div class="sentence pop" id="cell">' + withGap(promptText) + '</div>'
          : '<div class="cell pop" id="cell">' +
              '<span class="cell-glyph' + promptCls + (promptText.length > 4 ? " long" : "") + '">' +
              esc(promptText) + '</span></div>') +
        (hint ? '<div class="hint">' + esc(hint) + '</div>' : '') +
      '</div>' +
      answersHTML +
      '<div class="row"><button class="btn btn-sm" id="learnBtn">📖 Learn · restarts</button><button class="btn btn-ghost btn-sm" id="quit">End round</button></div>' +
    '</div>';

  document.getElementById("quit").onclick = function () { finish(p); };

  if (q.typing) {
    const form = document.getElementById("typeForm"), input = document.getElementById("typeIn");
    input.focus();
    form.onsubmit = function (e) {
      e.preventDefault();
      const given = input.value.trim().toLowerCase();
      if (!given) return;
      const accepted = [showForm(p, q.answer, q.to)].concat(ALT_ROMAJI[q.answer] || []);
      answerMatch(p, accepted.indexOf(given) !== -1 ? q.answer : "__wrong__", null);
    };
  } else {
    screenEl.querySelectorAll(".ans").forEach(function (b) {
      b.onclick = function () { answerMatch(p, b.getAttribute("data-k"), b); };
    });
  }
}

function answerMatch(p, chosen, btn) {
  if (session.locked) return;
  const t = tierOf(p), q = session.q;
  const cell = document.getElementById("cell");

  if (chosen === q.answer) {
    session.locked = true;
    audio.good();
    if (btn) btn.classList.add("correct");
    cell.classList.remove("shake");
    cell.classList.add("good");
    if (session.answeredWrongHere) { bump(p, q.answer, true); save(); }
    else {
      credit(p, q.answer, true);
      if (powerGain(p)) { audio.star(); setTimeout(function () { finish(p); }, 420); return; }
    }
    setTimeout(function () { advanceMatch(p); }, 620);
    return;
  }

  audio.bad();
  cell.classList.add("shake");
  setTimeout(function () { cell.classList.remove("shake"); }, 400);

  if (!session.answeredWrongHere) { credit(p, q.answer, false); powerLose(p); session.answeredWrongHere = true; }

  if (t.retry) {                     // Sprout keeps trying so they end on a win
    if (btn) { btn.classList.add("wrong", "dim"); btn.disabled = true; }
    return;
  }

  session.locked = true;
  session.paused = true;              // do not drain during the reveal
  cell.classList.add("bad");
  if (btn) btn.classList.add("wrong");
  screenEl.querySelectorAll(".ans").forEach(function (b) {
    b.disabled = true;
    if (b.getAttribute("data-k") === q.answer) b.classList.add("correct");
  });
  const typeIn = document.getElementById("typeIn");
  if (typeIn) { typeIn.disabled = true; typeIn.value = showForm(p, q.answer, q.to); }
  setTimeout(function () { advanceMatch(p); }, 1150);
}

function advanceMatch(p) {
  session.locked = false;
  session.paused = false;
  session.answeredWrongHere = false;
  // Rotate the working five every few questions so the kana keep changing.
  session.asked = (session.asked || 0) + 1;
  if (session.asked % 4 === 0) refreshPool(p);
  session.q = buildQuestion(p);
  render();
}

/* ---------- MEMORY PAIRS ---------- */

function setupPairs(p) {
  const fm = pickForms(p);
  session.fromForm = fm.from;
  session.toForm = fm.to;
  const cards = [];
  session.pool.forEach(function (k, i) {
    cards.push({ id:"k" + i, kana:k, kind:"front" });
    cards.push({ id:"r" + i, kana:k, kind:"back" });
  });
  session.cards = shuffle(cards);
  session.up = [];
  session.boardMatched = 0;
  session.boardPairs = session.pool.length;
  session.boards += 1;
  startPeek(p);
}

// Ten seconds to study a fresh board before it turns over. The power clock
// holds while the player reads.
function startPeek(p) {
  session.preview = true;
  session.previewLeft = 10;
  session.paused = true;
}

// Armed from the render, not from setup: go() runs stopLoops() on its way in
// and would clear an interval started any earlier.
function armPeek(p) {
  if (!session.preview || session.timer) return;
  session.timer = setInterval(function () {
    if (!session || session.ended || !session.preview) {
      clearInterval(session.timer); session.timer = null; return;
    }
    if (session.studyOpen) return;
    session.previewLeft -= 1;
    if (session.previewLeft <= 0) { endPeek(p); return; }
    const el = document.getElementById("peekCount");
    if (el) el.textContent = session.previewLeft;
  }, 1000);
}

function endPeek(p) {
  if (session.timer) { clearInterval(session.timer); session.timer = null; }
  session.preview = false;
  session.previewLeft = 0;
  session.paused = false;
  if (screen === "pairs") renderPairs(p);
}

function renderPairs(p) {
  const peeking = !!session.preview;
  // Vocabulary faces need a roomier grid than single kana do.
  const longFace = session.cards.some(function (c) {
    const fm = c.kind === "front" ? session.fromForm : session.toForm;
    return showForm(p, c.kana, fm).length > 4;
  });
  const cards = session.cards.map(function (c, i) {
    const form = c.kind === "front" ? session.fromForm : session.toForm;
    const face = showForm(p, c.kana, form);
    const isUp = peeking || session.up.indexOf(i) !== -1;
    const cls = "card " + formClass(form) + (face.length > 5 ? " long" : "") +
                (c.done ? " done" : isUp ? " up" : "") + (peeking ? " peeking" : "");
    return '<button class="' + cls + '" data-i="' + i + '"' +
           ((c.done || peeking) ? " disabled" : "") + '>' +
           ((isUp || c.done) ? esc(face) : "") + '</button>';
  }).join("");

  screenEl.innerHTML =
    '<div class="stack">' +
      unlockBanner() +
      '<div class="row">' + boardTag() + '</div>' +
      powerHUD() +
      (peeking
        ? '<div class="peek">' +
            '<span class="peek-text">Remember where they are…</span>' +
            '<span class="peek-count" id="peekCount">' + session.previewLeft + '</span>' +
            '<button class="btn btn-sm btn-primary" id="peekGo">Ready</button>' +
          '</div>'
        : '') +
      '<div class="pairgrid' + (longFace ? " wide" : "") + '">' + cards + '</div>' +
      '<div class="row"><button class="btn btn-sm" id="learnBtn">📖 Learn · restarts</button><button class="btn btn-ghost btn-sm" id="quit">End round</button></div>' +
    '</div>';

  screenEl.querySelectorAll("[data-i]").forEach(function (b) {
    b.onclick = function () { flip(p, parseInt(b.getAttribute("data-i"), 10)); };
  });
  const go = document.getElementById("peekGo");
  if (go) go.onclick = function () { endPeek(p); };
  document.getElementById("quit").onclick = function () { finish(p); };
  if (peeking) armPeek(p);
}

function flip(p, i) {
  if (session.locked || session.preview) return;
  const card = session.cards[i];
  if (card.done || session.up.indexOf(i) !== -1) return;

  session.up.push(i);
  renderPairs(p);
  if (session.up.length < 2) return;

  session.locked = true;
  const a = session.cards[session.up[0]], b = session.cards[session.up[1]];

  if (a.kana === b.kana && a.kind !== b.kind) {
    audio.good();
    a.done = true; b.done = true;
    session.boardMatched += 1;
    credit(p, a.kana, true);
    const filled = powerGain(p);
    setTimeout(function () {
      session.up = []; session.locked = false;
      if (filled) { audio.star(); finish(p); return; }
      if (session.boardMatched >= session.boardPairs) {   // board cleared - deal a fresh five
        audio.done();
        refreshPool(p);
        setupPairs(p);
      }
      renderPairs(p);
    }, 480);
  } else {
    audio.bad();
    credit(p, a.kana, false);
    powerLose(p);
    setTimeout(function () { session.up = []; session.locked = false; renderPairs(p); }, 900);
  }
}

/* ---------- FRUIT BASKET ---------- */

function fruitSVG(n) {
  const c = "var(--fruit-" + (n + 1) + ")";
  return '<svg class="fruit-svg" viewBox="0 0 78 84" aria-hidden="true">' +
           '<path d="M39 16 q3 -9 12 -11 q-2 9 -10 12 z" fill="var(--wakakusa)"/>' +
           '<rect x="37" y="8" width="4" height="12" rx="2" fill="var(--ink-soft)"/>' +
           '<circle cx="39" cy="51" r="30" fill="' + c + '"/>' +
           '<ellipse cx="28" cy="40" rx="8" ry="5" fill="#fff" opacity=".28" transform="rotate(-28 28 40)"/>' +
         '</svg>';
}

function setupFruit(p) {
  const fm = pickForms(p);
  session.fromForm = fm.from;
  session.toForm = fm.to;
  session.items = shuffle(session.pool).map(function (k, i) {
    return { kana: k, colour: i % 5, placed: false };
  });
  session.slots = shuffle(session.pool.slice());
  session.boardMatched = 0;
  session.boardPairs = session.pool.length;
  session.boards += 1;
  session.picked = null;
}

function renderFruit(p) {
  const fromF = session.fromForm, toF = session.toForm;

  const fruits = session.items.map(function (it, i) {
    const label = showForm(p, it.kana, fromF);
    const wide = label.length > 3;
    return '<button class="fruit' + (wide ? " wide" : "") + (it.placed ? " gone" : "") +
             '" data-f="' + i + '"' +
             (it.placed ? " disabled" : "") + ' aria-label="' + esc(label) + '">' +
             fruitSVG(it.colour) +
             '<span class="fruit-label ' + formClass(fromF) + '">' + esc(label) + '</span>' +
           '</button>';
  }).join("");

  const bags = session.slots.map(function (k, i) {
    const filled = session.items.some(function (it) { return it.placed && it.kana === k; });
    const label = showForm(p, k, toF);
    return '<button class="bag' + (filled ? " filled" : "") + (label.length > 6 ? " wide" : "") +
             '" data-b="' + i + '" data-k="' + k + '">' +
             '<span class="bag-mouth"></span>' +
             (filled ? '<span class="caught-kana ' + formClass(fromF) + '">' + esc(showForm(p, k, fromF)) + '</span>' : '') +
             '<span class="bag-label ' + formClass(toF) + (label.length > 6 ? " long" : "") + '">' + esc(label) + '</span>' +
           '</button>';
  }).join("");

  screenEl.innerHTML =
    '<div class="stack">' +
      unlockBanner() +
      '<div class="row">' + boardTag() + '</div>' +
      powerHUD() +
      '<div class="sheet stack">' +
        '<span class="eyebrow">Drag each fruit into its matching bag</span>' +
        '<div class="orchard" id="orchard">' + fruits + '</div>' +
      '</div>' +
      '<div class="bags" id="bags">' + bags + '</div>' +
      '<p style="font-size:12.5px;text-align:center">Drag a fruit into a bag — or tap the fruit, then tap the bag.</p>' +
      '<div class="row"><button class="btn btn-sm" id="learnBtn">📖 Learn · restarts</button><button class="btn btn-ghost btn-sm" id="quit">End round</button></div>' +
    '</div>';

  document.getElementById("quit").onclick = function () { finish(p); };
  wireFruit(p);
}

function wireFruit(p) {
  const fruits = Array.prototype.slice.call(screenEl.querySelectorAll("[data-f]"));
  const bags   = Array.prototype.slice.call(screenEl.querySelectorAll("[data-b]"));
  let drag = null;
  let didDrag = false;

  function bagUnder(x, y) {
    for (let i = 0; i < bags.length; i++) {
      const r = bags[i].getBoundingClientRect();
      if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return bags[i];
    }
    return null;
  }

  function clearHot() { bags.forEach(function (b) { b.classList.remove("hot"); }); }

  function attempt(fruitEl, bagEl) {
    const it = session.items[parseInt(fruitEl.getAttribute("data-f"), 10)];
    const want = bagEl.getAttribute("data-k");
    if (it.placed) return;

    if (it.kana === want) {
      audio.good();
      it.placed = true;
      session.boardMatched += 1;
      credit(p, it.kana, true);
      if (powerGain(p)) { audio.star(); renderFruit(p); setTimeout(function () { finish(p); }, 420); return; }
      if (session.boardMatched >= session.boardPairs) {   // board cleared - deal a fresh five
        audio.done();
        refreshPool(p);
        setupFruit(p);
      }
      renderFruit(p);
    } else {
      audio.bad();
      credit(p, it.kana, false);
      powerLose(p);
      fruitEl.classList.add("nope");
      bagEl.classList.add("nope");
      setTimeout(function () {
        fruitEl.classList.remove("nope");
        bagEl.classList.remove("nope");
      }, 420);
    }
  }

  function selectFruit(el) {
    if (session.picked === el) { session.picked = null; el.classList.remove("picked"); return; }
    fruits.forEach(function (f) { f.classList.remove("picked"); });
    session.picked = el;
    el.classList.add("picked");
  }

  fruits.forEach(function (el) {
    el.addEventListener("pointerdown", function (e) {
      if (el.disabled) return;
      didDrag = false;
      const r = el.getBoundingClientRect();
      drag = { el: el, sx: e.clientX, sy: e.clientY, ox: r.left, oy: r.top };
      try { el.setPointerCapture(e.pointerId); } catch (err) { /* older browsers */ }
    });

    el.addEventListener("pointermove", function (e) {
      if (!drag || drag.el !== el) return;
      const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
      if (!didDrag && Math.abs(dx) + Math.abs(dy) < 8) return;
      if (!didDrag) { didDrag = true; el.classList.add("dragging"); }
      el.style.transform = "translate(" + dx + "px," + dy + "px) scale(1.1)";
      clearHot();
      const over = bagUnder(e.clientX, e.clientY);
      if (over) over.classList.add("hot");
    });

    function endDrag(e) {
      if (!drag || drag.el !== el) return;
      const wasDrag = didDrag;
      el.classList.remove("dragging");
      el.style.transform = "";
      clearHot();
      drag = null;
      if (!wasDrag) return;                 // a tap: let the click handler take it
      const over = bagUnder(e.clientX, e.clientY);
      if (over) attempt(el, over);
    }
    el.addEventListener("pointerup", endDrag);
    el.addEventListener("pointercancel", function () {
      if (!drag || drag.el !== el) return;
      el.classList.remove("dragging");
      el.style.transform = "";
      clearHot();
      drag = null;
    });

    // Tap-then-tap, and the keyboard path (Enter on a focused button).
    el.addEventListener("click", function () {
      if (didDrag) { didDrag = false; return; }
      if (el.disabled) return;
      selectFruit(el);
    });
  });

  bags.forEach(function (bagEl) {
    bagEl.addEventListener("click", function () {
      if (!session.picked) return;
      const chosen = session.picked;
      session.picked = null;
      chosen.classList.remove("picked");
      attempt(chosen, bagEl);
    });
  });
}

/* ---------- WORD BUILDING ---------- */

function setupWord(p) {
  const learned = learnedKana(p);
  const count = rowsIntroduced(p);
  const LIST = courseOf(p).words || [];
  const isVocab = courseOf(p).kind !== "kana";

  // On a kana course a word is playable once every character in it is known.
  // On a vocabulary course the word itself is the item, so ask about the word.
  let usable = LIST.filter(function (x) {
    if (x.row >= count) return false;
    return isVocab
      ? learned.indexOf(x.w) !== -1
      : x.w.split("").every(function (k) { return learned.indexOf(k) !== -1; });
  });
  if (!usable.length) usable = LIST.slice(0, 5);

  // Favour words that exercise this board's weak five.
  const weak = session.pool;
  function relevance(x) {
    return isVocab
      ? (weak.indexOf(x.w) !== -1 ? 1 : 0)
      : x.w.split("").filter(function (k) { return weak.indexOf(k) !== -1; }).length;
  }
  const ranked = shuffle(usable).sort(function (a, b) { return relevance(b) - relevance(a); });

  session.words = ranked.slice(0, Math.min(5, ranked.length));
  session.wi = 0;
  session.boards += 1;
  loadWord(p);
}

function loadWord(p) {
  const letters = session.words[session.wi].w.split("");
  session.wordLetters = letters;
  session.filled = letters.map(function () { return null; });

  // Two decoy characters so it is a spelling task, not just re-ordering.
  // They are drawn from the letters used by other words in this course, which
  // works whether the items are single kana or whole vocabulary words.
  const alphabet = {};
  (courseOf(p).words || []).forEach(function (x) {
    x.w.split("").forEach(function (ch) { if (letters.indexOf(ch) === -1) alphabet[ch] = 1; });
  });
  const extras = shuffle(Object.keys(alphabet)).slice(0, 2);

  session.tray = shuffle(letters.concat(extras)).map(function (k, i) {
    return { k: k, id: i, used: false };
  });
}

function renderWord(p) {
  const entry = session.words[session.wi];
  const nextIdx = session.filled.indexOf(null);
  const solved = nextIdx === -1;

  const slots = session.wordLetters.map(function (k, i) {
    const got = session.filled[i];
    const cls = "slot" + (got ? " filled" : "") + (!got && i === nextIdx ? " next" : "");
    return '<div class="' + cls + '" data-s="' + i + '">' + (got || "") + '</div>';
  }).join("");

  const tray = session.tray.map(function (t, i) {
    return '<button class="tile' + (t.used ? " used" : "") + '" data-t="' + i + '"' +
           (t.used ? " disabled" : "") + ' aria-label="kana ' + t.k + '">' + t.k + '</button>';
  }).join("");

  screenEl.innerHTML =
    '<div class="stack">' +
      unlockBanner() +
      '<div class="row">' + boardTag() + '<span class="spacer"></span>' +
        '<span class="grow-label">word ' + (session.wi + 1) + ' of ' + session.words.length + '</span></div>' +
      powerHUD() +
      '<div class="sheet stack">' +
        (entry.pic ? '<div class="word-pic" aria-hidden="true">' + entry.pic + '</div>' : '') +
        '<div class="word-en' + (entry.pic ? '' : ' solo') + '">' + esc(entry.en) + '</div>' +
        '<div class="slots">' + slots + '</div>' +
        (solved
          ? '<div class="word-win"><div class="kana-big">' + entry.w + '</div>' +
            '<div class="reading">' + entry.en + '</div></div>'
          : '') +
      '</div>' +
      (solved ? '' : '<div class="tray">' + tray + '</div>') +
      (solved ? '' : '<p style="font-size:12.5px;text-align:center">Tap a kana to drop it in the next box — or drag it where you want.</p>') +
      '<div class="row"><button class="btn btn-sm" id="learnBtn">📖 Learn · restarts</button><button class="btn btn-ghost btn-sm" id="quit">End round</button></div>' +
    '</div>';

  document.getElementById("quit").onclick = function () { finish(p); };
  if (!solved) wireWord(p);
}

function placeLetter(p, ti, si) {
  const t = session.tray[ti];
  if (!t || t.used) return;
  if (session.filled[si] !== null) return;
  const want = session.wordLetters[si];

  if (t.k === want) {
    audio.good();
    t.used = true;
    session.filled[si] = t.k;
    credit(p, t.k, true);
    const filled = powerGain(p);
    const solved = session.filled.indexOf(null) === -1;
    renderWord(p);
    if (filled) { audio.star(); setTimeout(function () { finish(p); }, 620); return; }
    if (solved) {
      audio.done();
      session.paused = true;                       // do not drain on the win screen
      setTimeout(function () {
        session.paused = false;
        session.wi += 1;
        if (session.wi >= session.words.length) {  // out of words - pick a fresh set
          refreshPool(p);
          setupWord(p);
        } else {
          loadWord(p);
        }
        renderWord(p);
      }, 1500);
    }
    return;
  }

  audio.bad();
  credit(p, want, false);
  powerLose(p);
  const tileEl = screenEl.querySelector('[data-t="' + ti + '"]');
  const slotEl = screenEl.querySelector('[data-s="' + si + '"]');
  if (tileEl) tileEl.classList.add("nope");
  if (slotEl) slotEl.classList.add("nope");
  setTimeout(function () {
    if (tileEl) tileEl.classList.remove("nope");
    if (slotEl) slotEl.classList.remove("nope");
  }, 420);
}

function wireWord(p) {
  const tiles = Array.prototype.slice.call(screenEl.querySelectorAll("[data-t]"));
  const slots = Array.prototype.slice.call(screenEl.querySelectorAll("[data-s]"));
  let drag = null, didDrag = false;

  function slotUnder(x, y) {
    for (let i = 0; i < slots.length; i++) {
      const r = slots[i].getBoundingClientRect();
      if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return slots[i];
    }
    return null;
  }
  function clearHot() { slots.forEach(function (s) { s.classList.remove("hot"); }); }

  tiles.forEach(function (el) {
    el.addEventListener("pointerdown", function (e) {
      if (el.disabled) return;
      didDrag = false;
      drag = { el: el, sx: e.clientX, sy: e.clientY };
      try { el.setPointerCapture(e.pointerId); } catch (err) { /* older browsers */ }
    });
    el.addEventListener("pointermove", function (e) {
      if (!drag || drag.el !== el) return;
      const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
      if (!didDrag && Math.abs(dx) + Math.abs(dy) < 8) return;
      if (!didDrag) { didDrag = true; el.classList.add("dragging"); }
      el.style.transform = "translate(" + dx + "px," + dy + "px) scale(1.1)";
      clearHot();
      const over = slotUnder(e.clientX, e.clientY);
      if (over) over.classList.add("hot");
    });
    el.addEventListener("pointerup", function (e) {
      if (!drag || drag.el !== el) return;
      const wasDrag = didDrag;
      el.classList.remove("dragging");
      el.style.transform = "";
      clearHot();
      drag = null;
      if (!wasDrag) return;              // a tap — the click handler takes it
      const over = slotUnder(e.clientX, e.clientY);
      if (over) placeLetter(p, parseInt(el.getAttribute("data-t"), 10), parseInt(over.getAttribute("data-s"), 10));
    });
    el.addEventListener("pointercancel", function () {
      if (!drag || drag.el !== el) return;
      el.classList.remove("dragging");
      el.style.transform = "";
      clearHot();
      drag = null;
    });
    // Tap fills the next empty box. Also the keyboard path (Enter on focus).
    el.addEventListener("click", function () {
      if (didDrag) { didDrag = false; return; }
      if (el.disabled) return;
      const nextIdx = session.filled.indexOf(null);
      if (nextIdx === -1) return;
      placeLetter(p, parseInt(el.getAttribute("data-t"), 10), nextIdx);
    });
  });
}

/* ---------- FISHING POND ---------- */

const FISH_H = 56;

function laneCount(h) {
  return Math.max(3, Math.min(5, Math.floor((h - 12) / (FISH_H + 12))));
}
function laneY(h, lane) {
  const n = laneCount(h);
  const span = Math.max(0, h - 12 - FISH_H);
  return 6 + (n > 1 ? lane * (span / (n - 1)) : span / 2);
}

function setupFish(p) {
  session.fishes = [];
  session.target = null;
  session.total = 0;
}

function renderFish(p) {
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  screenEl.innerHTML =
    '<div class="stack">' +
      unlockBanner() +
      '<div class="row">' + boardTag() + '</div>' +
      '<div class="prompt-card">' +
        '<div class="eyebrow" id="promptHint">Catch this sound</div>' +
        '<div class="prompt-big" id="promptBig">—</div>' +
      '</div>' +
      powerHUD() +
      '<div class="pond" id="pond">' +
        '<span class="pond-deco" style="left:6%;bottom:5px" aria-hidden="true">🪷</span>' +
        '<span class="pond-deco" style="right:8%;bottom:8px" aria-hidden="true">🪷</span>' +
        '<span class="pond-deco" style="left:46%;bottom:3px;font-size:16px" aria-hidden="true">🌿</span>' +
      '</div>' +
      '<div class="row"><button class="btn btn-sm" id="learnBtn">📖 Learn · restarts</button><button class="btn btn-ghost btn-sm" id="quit">End round</button></div>' +
    '</div>';

  document.getElementById("quit").onclick = function () { finish(p); };

  const pond = document.getElementById("pond");
  const big = document.getElementById("promptBig");
  const hint = document.getElementById("promptHint");

  // The prompt flips direction each catch: sometimes it shows a kana and the
  // fish carry romaji, sometimes the other way round.
  function newTarget() {
    // The whole level swims here, not just the working five, so a review
    // level with 15 kana actually shows all 15.
    session.target = nextKana(p, session.levelPool, session.target);
    const fm = pickForms(p);
    session.fromForm = fm.from;
    session.toForm = fm.to;
    const shown = showForm(p, session.target, fm.from);
    if (shown.indexOf("＿") !== -1) big.innerHTML = withGap(shown);
    else big.textContent = shown;
    big.className = "prompt-big " + formClass(fm.from) + (shown.length > 6 ? " long" : "");
    const gram = courseOf(p).kind === "grammar";
    hint.textContent = gram ? (itemOf(p, session.target).en || "Fill the gap")
                     : fm.to === "en" ? "Catch the meaning"
                     : isJpForm(fm.to) ? "Catch the matching kana" : "Catch the sound";
    session.total += 1;
  }
  newTarget();

  function spawn() {
    const alive = session.fishes.filter(function (f) { return !f.dead; });
    const hasTarget = alive.some(function (f) { return f.kana === session.target; });
    const kana = hasTarget
      ? pick(distractors(p, session.target, 7, session.levelPool, session.toForm).concat([session.target]))
      : session.target;

    const el = document.createElement("button");
    const toLeft = Math.random() < 0.5;
    const wideFish = showForm(p, kana, session.toForm).length > 4;
    // The fish shows the OPPOSITE script to the prompt.
    const label = showForm(p, kana, session.toForm);
    el.className = "fish" + (toLeft ? " left" : "") + (wideFish ? " wide" : "");
    el.innerHTML =
      '<svg class="fish-svg" viewBox="0 0 118 66" aria-hidden="true">' +
        '<polygon class="tail" points="4,33 32,14 32,52"/>' +
        '<ellipse class="body" cx="70" cy="33" rx="44" ry="25"/>' +
        '<circle class="eye" cx="98" cy="25" r="3.4"/>' +
      '</svg>' +
      '<span class="fish-label ' + formClass(session.toForm) +
        (label.length > 4 ? " long" : "") + '">' + esc(label) + '</span>';
    el.setAttribute("aria-label", label);

    const h = pond.clientHeight || 320, w = pond.clientWidth || 320;

    // Swim lanes sized to the pond, so fish never stack.
    const LANES = laneCount(h);
    const busy = {};
    session.fishes.forEach(function (o) { if (!o.dead) busy[o.lane] = (busy[o.lane] || 0) + 1; });
    let lane = 0, fewest = Infinity;
    const order = [];
    for (let l = 0; l < LANES; l++) order.push(l);
    shuffle(order).forEach(function (l) {
      const n = busy[l] || 0;
      if (n < fewest) { fewest = n; lane = l; }
    });

    const f = {
      kana: kana, el: el, dead: false, lane: lane,
      dir: toLeft ? -1 : 1,
      x: toLeft ? w + 20 : -160,
      y: laneY(h, lane),
      speed: reduce ? 22 : 42 + Math.random() * 34,
      phase: Math.random() * Math.PI * 2
    };
    el.style.transform = "translate(" + f.x + "px," + f.y + "px)";
    el.onclick = function () { caught(f); };
    pond.appendChild(el);
    session.fishes.push(f);
  }

  function caught(f) {
    if (f.dead) return;
    f.dead = true;
    f.el.style.setProperty("--fx", f.x + "px");
    f.el.style.setProperty("--fy", f.y + "px");

    if (f.kana === session.target) {
      audio.good();
      f.el.classList.add("caught");
      credit(p, f.kana, true);
      setTimeout(function () { if (f.el.parentNode) f.el.parentNode.removeChild(f.el); }, 340);
      if (powerGain(p)) { audio.star(); finish(p); return; }
      newTarget();
      return;
    } else {
      audio.bad();
      f.el.classList.add("miss");
      credit(p, session.target, false);
      powerLose(p);
    }
    setTimeout(function () { if (f.el.parentNode) f.el.parentNode.removeChild(f.el); }, 340);
  }

  let last = null, sinceSpawn = 99;

  function frame(ts) {
    if (screen !== "fish") return;
    if (last === null) last = ts;
    const dt = Math.min(0.05, (ts - last) / 1000);
    last = ts;
    if (session.studyOpen) { session.raf = requestAnimationFrame(frame); return; }

    const alive = session.fishes.filter(function (f) { return !f.dead; });
    sinceSpawn += dt;
    if (sinceSpawn > (reduce ? 1.5 : 0.8) && alive.length < laneCount(pond.clientHeight || 320)) {
      sinceSpawn = 0; spawn();
    }

    const w = pond.clientWidth || 320;
    session.fishes.forEach(function (f) {
      if (f.dead) return;
      f.x += f.speed * f.dir * dt;
      f.phase += dt * 2.2;
      const bob = reduce ? 0 : Math.sin(f.phase) * 4;
      f.el.style.transform = "translate(" + f.x + "px," + (f.y + bob) + "px)";
      if ((f.dir > 0 && f.x > w + 40) || (f.dir < 0 && f.x < -200)) {
        f.dead = true;
        if (f.el.parentNode) f.el.parentNode.removeChild(f.el);
        // If the answer swam away the prompt stays put - the spawner sees no
        // target in the pond and sends that same kana back round.
      }
    });
    session.fishes = session.fishes.filter(function (f) { return !f.dead; });
    session.raf = requestAnimationFrame(frame);
  }
  session.raf = requestAnimationFrame(frame);
}

/* ============================================================
   12. RESULT
   ============================================================ */

function renderResult(p) {
  const s = session || { hits:0, total:0, best:0, missed:{}, mode:"match" };
  const weak = Object.keys(s.missed || {});
  const headline = (s.score || 0) + " / " + (s.quota || 0);
  const praise = s.won
    ? "Level passed — power held out."
    : ((s.score || 0) >= (s.quota || 1) * 0.6
        ? "Power ran out just short. One more go."
        : "Power ran out. Quick right answers top it back up.");
  const weakList = weak;

  screenEl.innerHTML =
    '<div class="stack">' +
      (s.levelUp
        ? '<div class="unlock">🎉 ' + s.levelUp.label + ' unlocked — ' + s.levelUp.kana.join(" ") + '</div>'
        : '') +
      '<div class="sheet stack" style="align-items:flex-start">' +
        (s.won ? '<div style="font-size:25px;letter-spacing:9px" aria-hidden="true">⛩️🌸🎌</div>' : '') +
        '<span class="eyebrow">Round finished · ' + (s.level ? s.level.label : "") + '</span>' +
        '<div class="result-num' + (s.won ? "" : " short") + '">' + headline + '</div>' +
        '<p>' + praise + (s.best > 2 ? " Best streak: " + s.best + "." : "") + '</p>' +
      '</div>' +
      (weak.length
        ? '<div class="sheet stack"><span class="eyebrow">Worth another look</span>' +
          '<div class="chips">' + weak.map(function (k) {
            return '<span class="chip weak"><span class="k">' + k + '</span>' +
                   showForm(p, k, courseOf(p).forms[courseOf(p).forms.length - 1]) + '</span>';
          }).join("") + '</div>' +
          '<p>These come round more often until they stick.</p></div>'
        : '') +
      '<div class="row">' +
        '<button class="btn btn-primary" id="again">Keep going →</button>' +
        '<button class="btn" id="toGarden">🌱 Kana Garden</button>' +
        '<button class="btn btn-ghost" id="toMenu2">Back</button>' +
      '</div>' +
    '</div>';

  if (s.levelUp) audio.star();
  document.getElementById("again").onclick = function () { startLevel(p); };
  document.getElementById("toGarden").onclick = function () { go("garden"); };
  document.getElementById("toMenu2").onclick = function () { go("menu"); };
}

/* ============================================================
   13. KANA GARDEN
   ============================================================ */

function renderGarden(p) {
  const c = courseOf(p);
  const answerForm = c.forms[c.forms.length - 1];
  const count = rowsIntroduced(p);
  const lv = levelInfo(p);

  function kanaSheet(list, title, startIndex) {
    const cells = [];
    list.forEach(function (unit, ri) {
      const locked = (startIndex + ri) >= count;
      for (let col = 0; col < 5; col++) {
        const k = unit.keys[col];
        if (!k) { cells.push('<div class="gcell empty" aria-hidden="true"></div>'); continue; }
        const b = box(p, k);
        const cls = "gcell" + (b >= MASTERED ? " mastered" : b > 0 ? " seen" : "") + (locked ? " locked" : "");
        cells.push('<button class="' + cls + '" data-k="' + k + '" title="' + esc(showForm(p, k, answerForm)) + '">' +
          '<span class="fill" style="height:' + Math.round((b / MASTERED) * 100) + '%"></span>' +
          (b >= MASTERED ? '<span class="sprout" aria-hidden="true">🌱</span>' : '') +
          '<span class="glyph">' + showForm(p, k, c.forms[0]) + '</span></button>');
      }
    });
    return '<div class="sheet stack garden-sheet"><span class="eyebrow">' + title + '</span>' +
           '<div class="garden">' + cells.join("") + '</div></div>';
  }

  function chipSheet(list, title, startIndex) {
    const cells = [];
    list.forEach(function (unit, ri) {
      const locked = (startIndex + ri) >= count;
      unit.keys.forEach(function (k) {
        const b = box(p, k);
        const cls = "vcell" + (b >= MASTERED ? " mastered" : b > 0 ? " seen" : "") + (locked ? " locked" : "");
        cells.push('<div class="' + cls + '">' +
          '<span class="fill" style="height:' + Math.round((b / MASTERED) * 100) + '%"></span>' +
          '<span class="vjp">' + showForm(p, k, c.forms[0]) +
            (b >= MASTERED ? ' 🌱' : '') + '</span>' +
          '<span class="ven">' + esc(showForm(p, k, answerForm)) + '</span></div>');
      });
    });
    return '<div class="sheet stack"><span class="eyebrow">' + title + '</span>' +
           '<div class="vgrid">' + cells.join("") + '</div></div>';
  }

  // Every kanji group this topic's ladder will teach, with its progress.
  function kanjiSheet() {
    const groups = [];
    ladderFor(p).forEach(function (st, i) {
      if (st.kind === "kanji") groups.push({ g: st.group, level: i });
    });
    if (!groups.length) return "";
    const cells = groups.map(function (row) {
      const locked = row.level > (prog(p).level || 0);
      return KANJI_KEYS[row.g].map(function (k) {
        const b = box(p, k);
        const cls = "vcell kanjicell" + (b >= MASTERED ? " mastered" : b > 0 ? " seen" : "") + (locked ? " locked" : "");
        return '<div class="' + cls + '">' +
          '<span class="fill" style="height:' + Math.round((b / MASTERED) * 100) + '%"></span>' +
          '<span class="kjc">' + k + '</span>' +
          '<span class="ven">' + esc(KANJI_ITEMS[k].kana) + ' · ' + esc(KANJI_ITEMS[k].en) + '</span></div>';
      }).join("");
    }).join("");
    return '<div class="sheet stack"><span class="eyebrow">漢字 · kanji levels</span>' +
           '<div class="vgrid">' + cells + '</div></div>';
  }

  const sheet = c.kind === "kana" ? kanaSheet : chipSheet;
  const learned = learnedKana(p);
  const mastered = learned.filter(function (k) { return box(p, k) >= MASTERED; }).length;
  const totalItems = unitsOf(p).reduce(function (n, u) { return n + u.keys.length; }, 0);

  const ladder = unitsOf(p).map(function (u, i) {
    const cls = i < count - 1 ? "learned" : i === count - 1 ? "current" : "";
    return '<span class="rung ' + cls + '">' + (i + 1) + '</span>';
  }).join("");

  screenEl.innerHTML =
    '<div class="stack">' +
      '<div class="sheet stack">' +
        '<span class="eyebrow">' + esc(p.name) + '&rsquo;s garden · ' + c.title + '</span>' +
        '<h2>' + mastered + ' of ' + totalItems + ' growing</h2>' +
        '<div class="ladder">' + ladder + '</div>' +
        '<p>' + (c.kind === "kana"
          ? "Tap any square to flip it to its sound. "
          : "") + 'The green fills up as an item gets stronger.</p>' +
      '</div>' +
      sheet(c.units, c.title, 0) +
      (tierOf(p).dakuten && c.extraUnits.length ? sheet(c.extraUnits, "Dakuten &amp; handakuten", c.units.length) : "") +
      kanjiSheet() +
      '<div class="row">' +
        '<button class="btn btn-primary" id="playNow">Practise</button>' +
        '<button class="btn btn-ghost" id="backMenu">Back</button>' +
      '</div>' +
    '</div>';

  // Tap a square to flip it to its answer form - the garden doubles as a chart.
  screenEl.querySelectorAll("[data-k]").forEach(function (b) {
    b.onclick = function () {
      audio.prime();
      const glyph = b.querySelector(".glyph");
      if (!glyph || b.dataset.flipped === "1") return;
      b.dataset.flipped = "1";
      const key = b.getAttribute("data-k");
      glyph.textContent = showForm(p, key, answerForm);
      glyph.classList.add("as-romaji");
      b.classList.add("pop");
      setTimeout(function () {
        glyph.textContent = showForm(p, key, c.forms[0]);
        glyph.classList.remove("as-romaji");
        b.classList.remove("pop");
        b.dataset.flipped = "";
      }, 1400);
    };
  });
  document.getElementById("playNow").onclick = function () { startLevel(p); };
  document.getElementById("backMenu").onclick = function () { go("menu"); };
}

/* ============================================================
   14. KEYBOARD
   ============================================================ */

document.addEventListener("keydown", function (e) {
  if (screen !== "match" || !session || session.locked) return;
  if (document.activeElement && document.activeElement.tagName === "INPUT") return;
  const n = parseInt(e.key, 10);
  if (!n || n < 1) return;
  const tiles = screenEl.querySelectorAll(".ans");
  if (n <= tiles.length) { e.preventDefault(); tiles[n - 1].click(); }
});

document.addEventListener("pointerdown", function () { audio.prime(); }, { once: true });

/* ============================================================
   15. BOOT
   ============================================================ */

screenEl.addEventListener("click", function (e) {
  const hit = e.target && e.target.closest ? e.target.closest("#learnBtn") : null;
  if (hit) { audio.prime(); openStudyOverlay(currentProfile()); }
});

(function boot() {
  const hash = location.hash.replace(/^#/, "");
  if (hash.indexOf("s=") === 0) {
    const restored = decodeState(hash.slice(2));
    if (restored && Array.isArray(restored.profiles)) { state = restored; save(); }
  }
  if (!state.profiles.length) {
    const saved = store.read();
    if (saved && Array.isArray(saved.profiles)) state = saved;
  }
  state.profiles.forEach(function (p) {          // backfill older saves
    if (!TIERS[p.tier]) p.tier = "explorer";
    if (!p.progress) {                           // pre-courses saves kept one flat set
      p.progress = { hiragana: { level: p.level || 0, boxes: p.boxes || {} } };
    }
    delete p.boxes;
    if (!p.course || !COURSES[p.course]) p.course = "hiragana";
    Object.keys(p.progress).forEach(function (id) {
      if (!COURSES[id]) { delete p.progress[id]; return; }
      const g = p.progress[id];
      if (!g.boxes) g.boxes = {};
      if (typeof g.level !== "number") g.level = 0;
    });
    prog(p);
    delete p.unlocked; delete p.lastKind; delete p.level;
    prog(p).level = Math.max(0, Math.min(prog(p).level, ladderFor(p).length - 1));
    p.stars = p.stars || 0;
  });
  state.activeId = null;
  render();
})();
</script>
