<title>Kana Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">

<style>
/* ============================================================
   Kana Quest
   Palette from traditional Japanese dye names:
   藍 ai · 朱 shu · 若草 wakakusa · 山吹 yamabuki, sumi ink on
   genkō yōshi (manuscript paper) ground.
   ============================================================ */
:root {
  --paper:        #ffffff;
  --ground:       #eef3f6;
  --ground-deep:  #e2eaef;
  --rule:         #c3d5df;
  --rule-strong:  #9db6c4;
  --ink:          #16232e;
  --ink-soft:     #566977;
  --ink-faint:    #8095a3;

  --ai:           #1d5691;
  --ai-bright:    #2c74bd;
  --ai-wash:      #dfebf6;

  --shu:          #cf4230;
  --shu-wash:     #fbe4e0;

  --wakakusa:     #4f8f36;
  --wakakusa-wash:#e2f2da;

  --yamabuki:     #c8850f;
  --yamabuki-wash:#fdf0d6;

  --pond:         #cfe6f2;
  --pond-deep:    #a9d2e8;

  --fruit-1:      #d94f42;
  --fruit-2:      #e08a1e;
  --fruit-3:      #6aa63c;
  --fruit-4:      #8360bd;
  --fruit-5:      #d6528a;

  --on-accent:    #ffffff;

  --shadow:       0 1px 2px rgba(22,35,46,.07), 0 6px 20px rgba(22,35,46,.09);
  --shadow-lift:  0 2px 4px rgba(22,35,46,.09), 0 14px 34px rgba(22,35,46,.14);

  --font-ui:   "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Yu Gothic", Meiryo, system-ui, sans-serif;
  --font-kana: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", Meiryo, sans-serif;

  --r-sm: 8px;
  --r-md: 14px;
  --r-lg: 22px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:        #17222c;
    --ground:       #0e161d;
    --ground-deep:  #0a1116;
    --rule:         #2c3d4a;
    --rule-strong:  #43596a;
    --ink:          #e6eef4;
    --ink-soft:     #9db0be;
    --ink-faint:    #6c8092;

    --ai:           #57a2e0;
    --ai-bright:    #8cc4f5;
    --ai-wash:      #17303f;

    --shu:          #f5806c;
    --shu-wash:     #3a2020;

    --wakakusa:     #93cd6e;
    --wakakusa-wash:#1f3319;

    --yamabuki:     #f0b455;
    --yamabuki-wash:#33280f;

    --pond:         #16323f;
    --pond-deep:    #1d4356;

    --fruit-1:      #ef7264;
    --fruit-2:      #efab4a;
    --fruit-3:      #8cc55c;
    --fruit-4:      #a88ada;
    --fruit-5:      #ed7aab;

    --on-accent:    #08131c;

    --shadow:       0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.4);
    --shadow-lift:  0 2px 4px rgba(0,0,0,.45), 0 14px 34px rgba(0,0,0,.5);
  }
}

:root[data-theme="dark"] {
  --paper:        #17222c;
  --ground:       #0e161d;
  --ground-deep:  #0a1116;
  --rule:         #2c3d4a;
  --rule-strong:  #43596a;
  --ink:          #e6eef4;
  --ink-soft:     #9db0be;
  --ink-faint:    #6c8092;

  --ai:           #57a2e0;
  --ai-bright:    #8cc4f5;
  --ai-wash:      #17303f;

  --shu:          #f5806c;
  --shu-wash:     #3a2020;

  --wakakusa:     #93cd6e;
  --wakakusa-wash:#1f3319;

  --yamabuki:     #f0b455;
  --yamabuki-wash:#33280f;

  --pond:         #16323f;
  --pond-deep:    #1d4356;

  --fruit-1:      #ef7264;
  --fruit-2:      #efab4a;
  --fruit-3:      #8cc55c;
  --fruit-4:      #a88ada;
  --fruit-5:      #ed7aab;

  --on-accent:    #08131c;

  --shadow:       0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.4);
  --shadow-lift:  0 2px 4px rgba(0,0,0,.45), 0 14px 34px rgba(0,0,0,.5);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background-color: var(--ground);
  background-image:
    linear-gradient(to right,  var(--rule) 1px, transparent 1px),
    linear-gradient(to bottom, var(--rule) 1px, transparent 1px);
  background-size: 46px 46px;
  background-position: center top;
  color: var(--ink);
  font-family: var(--font-ui);
  font-weight: 500;
  -webkit-text-size-adjust: 100%;
  overflow-x: hidden;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(ellipse 120% 90% at 50% 30%, transparent 30%, var(--ground) 100%);
  z-index: 0;
}

#app {
  position: relative;
  z-index: 1;
  max-width: 780px;
  margin: 0 auto;
  padding: 14px 16px 48px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  min-height: 100vh;
}

button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--ai-bright); outline-offset: 3px; border-radius: var(--r-sm); }

/* ---------- ambient Japanese decorations ----------
   Fixed, faint, and behind the content column. Hidden on narrow screens
   where they would sit under the cards anyway. */
.deco {
  position: fixed; z-index: 0;
  pointer-events: none; user-select: none;
  opacity: .13; font-size: 44px; line-height: 1;
}
.deco.float { animation: decoFloat 9s ease-in-out infinite; }
@keyframes decoFloat {
  0%, 100% { transform: translateY(0) rotate(-4deg); }
  50%      { transform: translateY(-14px) rotate(4deg); }
}
.petal {
  position: fixed; top: -36px; z-index: 0;
  pointer-events: none; user-select: none;
  font-size: 17px; opacity: .3;
  animation: petalFall linear infinite;
}
@keyframes petalFall {
  0%   { transform: translate(0, -4vh) rotate(0deg); }
  100% { transform: translate(-9vw, 108vh) rotate(320deg); }
}
@media (max-width: 899px) { .deco { display: none; } }
@media (prefers-reduced-motion: reduce) {
  .petal { display: none; }
  .deco.float { animation: none; }
}

.pond-deco {
  position: absolute; z-index: 0;
  font-size: 21px; opacity: .55;
  pointer-events: none; user-select: none;
}

/* ---------- top bar ---------- */
.topbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.brand {
  display: flex; align-items: baseline; gap: 9px;
  margin-right: auto; background: none; border: 0; padding: 4px 2px;
}
.brand-mark {
  font-family: var(--font-kana); font-weight: 900; font-size: 26px; line-height: 1;
  color: #fff; background: var(--shu); border-radius: 7px; padding: 7px 9px 9px;
}
.brand-name { font-weight: 800; font-size: 19px; letter-spacing: -.01em; }
.who {
  display: flex; align-items: center; gap: 8px;
  background: var(--paper); border: 1.5px solid var(--rule);
  border-radius: 999px; padding: 5px 14px 5px 7px; box-shadow: var(--shadow);
}
.who-face { font-size: 21px; line-height: 1; }
.who-name { font-weight: 700; font-size: 15px; }
.stars {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--yamabuki-wash); color: var(--yamabuki);
  border-radius: 999px; padding: 6px 13px;
  font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums;
}

/* ---------- surfaces & type ---------- */
.sheet {
  background: var(--paper); border: 1.5px solid var(--rule);
  border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 22px;
}
h1, h2, h3 { margin: 0; text-wrap: balance; letter-spacing: -.015em; }
h1 { font-size: clamp(24px, 5.2vw, 33px); font-weight: 800; }
h2 { font-size: 21px; font-weight: 800; }
p  { margin: 0; color: var(--ink-soft); line-height: 1.6; }
.eyebrow {
  font-size: 11.5px; font-weight: 800; letter-spacing: .13em;
  text-transform: uppercase; color: var(--ink-faint);
}
.stack { display: flex; flex-direction: column; gap: 14px; }
.row   { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.spacer{ flex: 1 1 auto; }
.grow-label { font-size: 12.5px; font-weight: 800; color: var(--ink-faint); letter-spacing: .04em; }

/* ---------- buttons ---------- */
.btn {
  border: 1.5px solid var(--rule); background: var(--paper);
  border-radius: var(--r-md); padding: 11px 17px;
  font-weight: 700; font-size: 15px;
  transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
  touch-action: manipulation; min-height: 46px;
}
.btn:active { transform: translateY(1px) scale(.985); }
.btn-primary { background: var(--ai); border-color: var(--ai); color: var(--on-accent); box-shadow: var(--shadow); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--ink-soft); }
.btn-ghost:hover { background: var(--ground-deep); }
.btn-danger { color: var(--shu); border-color: var(--shu); background: transparent; }
.btn-sm { padding: 7px 12px; font-size: 13.5px; min-height: 38px; border-radius: 10px; }

/* ---------- home ---------- */
.hero-kana {
  font-family: var(--font-kana); font-weight: 900;
  font-size: clamp(46px, 13vw, 78px); line-height: 1;
  color: var(--ai); letter-spacing: .06em; display: flex; gap: .08em;
}
.hero-kana span { animation: settle .5s cubic-bezier(.2,1.3,.4,1) both; }
.hero-kana span:nth-child(2) { animation-delay: .07s; }
.hero-kana span:nth-child(3) { animation-delay: .14s; }
.hero-kana span:nth-child(4) { animation-delay: .21s; }
@keyframes settle { from { opacity:0; transform: translateY(-14px) scale(.8) rotate(-6deg); } to { opacity:1; transform:none; } }

.profiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 12px; }
.pslot { position: relative; display: flex; }
.profile {
  flex: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 3px;
  background: var(--paper); border: 1.5px solid var(--rule);
  border-radius: var(--r-md); padding: 15px 15px 13px; text-align: left;
  transition: transform .14s ease, box-shadow .14s ease, border-color .14s ease;
  min-height: 118px;
}
.profile:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); border-color: var(--ai); }
.profile-face { font-size: 32px; line-height: 1.1; }
.profile-name { font-weight: 800; font-size: 16.5px; }
.profile-meta { font-size: 12.5px; color: var(--ink-faint); font-weight: 600; }
.profile-bar { margin-top: 8px; width: 100%; height: 6px; border-radius: 99px; background: var(--ground-deep); overflow: hidden; }
.profile-bar i { display: block; height: 100%; background: var(--wakakusa); border-radius: 99px; }
.profile-gear {
  position: absolute; top: 8px; right: 8px; border: 0; background: transparent;
  font-size: 15px; line-height: 1; padding: 6px; border-radius: 8px; opacity: .5;
}
.profile-gear:hover { opacity: 1; background: var(--ground-deep); }
.profile.add { border-style: dashed; align-items: center; justify-content: center; color: var(--ink-faint); font-weight: 700; }

/* ---------- level play card ---------- */
.playcard {
  display: flex; flex-direction: column; align-items: flex-start; gap: 5px;
  width: 100%; text-align: left;
  background: var(--paper); border: 1.5px solid var(--rule);
  border-left: 6px solid var(--ai); border-radius: var(--r-lg);
  padding: 20px 22px 18px; box-shadow: var(--shadow);
  transition: transform .14s ease, box-shadow .14s ease;
}
.playcard:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); }
.playcard:active { transform: translateY(0) scale(.995); }
.playcard.m-fish  { border-left-color: var(--ai-bright); }
.playcard.m-fruit { border-left-color: var(--fruit-1); }
.playcard.m-pairs { border-left-color: var(--wakakusa); }
.playcard.m-word  { border-left-color: var(--yamabuki); }
.playcard-verb {
  font-size: 10.5px; font-weight: 800; letter-spacing: .13em;
  text-transform: uppercase; color: var(--ink-faint);
}
.playcard-title { font-weight: 800; font-size: 25px; letter-spacing: -.02em; }
.playcard-sub { font-size: 13.5px; color: var(--ink-soft); font-weight: 500; line-height: 1.45; }
.playcard-go {
  margin-top: 12px; align-self: stretch; text-align: center;
  background: var(--ai); color: var(--on-accent);
  border-radius: var(--r-md); padding: 13px 18px;
  font-weight: 800; font-size: 16px;
}

/* ---------- board banner ---------- */
.board-tag {
  display: inline-flex; align-items: center; gap: 8px;
  border: 1.5px solid var(--rule); background: var(--paper);
  border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 700;
  color: var(--ink-soft);
}
.board-tag b { color: var(--ink); font-family: var(--font-kana); font-size: 15px; }
.unlock {
  border: 2px solid var(--yamabuki); background: var(--yamabuki-wash); color: var(--yamabuki);
  border-radius: var(--r-md); padding: 14px 16px; font-weight: 800;
  display: flex; align-items: center; gap: 10px;
  animation: settle .45s cubic-bezier(.2,1.3,.4,1) both;
}
.notice {
  border: 1.5px solid var(--rule); background: var(--ai-wash);
  border-radius: var(--r-md); padding: 12px 14px;
  font-size: 13.5px; font-weight: 600; color: var(--ink-soft); line-height: 1.5;
}

/* ---------- genkō yōshi cell (Match) ---------- */
.cell {
  position: relative; aspect-ratio: 1; width: min(232px, 58vw);
  border: 2.5px solid var(--rule-strong); border-radius: var(--r-md);
  background: var(--paper); display: grid; place-items: center; margin: 0 auto;
  transition: border-color .2s ease, background .2s ease;
}
.cell::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background-image:
    repeating-linear-gradient(to bottom, var(--rule) 0 7px, transparent 7px 14px),
    repeating-linear-gradient(to right,  var(--rule) 0 7px, transparent 7px 14px);
  background-size: 1.5px 100%, 100% 1.5px;
  background-position: center center;
  background-repeat: no-repeat;
  opacity: .85;
}
.cell-glyph {
  position: relative; font-family: var(--font-kana); font-weight: 700;
  font-size: min(148px, 37vw); line-height: 1; color: var(--ink); user-select: none;
}
.cell-glyph.romaji {
  font-family: var(--font-ui); font-weight: 800;
  font-size: min(76px, 19vw); letter-spacing: -.02em; color: var(--ai);
}
.cell.good { border-color: var(--wakakusa); background: var(--wakakusa-wash); }
.cell.bad  { border-color: var(--shu);      background: var(--shu-wash); }
.cell.pop  { animation: pop .34s cubic-bezier(.2,1.4,.4,1); }
.cell.shake{ animation: shake .38s ease; }
@keyframes pop   { 0%{transform:scale(.86)} 60%{transform:scale(1.04)} 100%{transform:scale(1)} }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-9px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(3px)} }


/* ---------- answer tiles ---------- */
.answers { display: grid; gap: 10px; }
.answers[data-n="3"] { grid-template-columns: repeat(3, 1fr); }
.answers[data-n="4"] { grid-template-columns: repeat(2, 1fr); }
.answers[data-n="6"] { grid-template-columns: repeat(3, 1fr); }
@media (max-width: 430px) {
  .answers[data-n="3"] { grid-template-columns: 1fr; }
  .answers[data-n="6"] { grid-template-columns: repeat(2, 1fr); }
}
.ans {
  position: relative; border: 2px solid var(--rule); background: var(--paper);
  border-radius: var(--r-md); min-height: 68px;
  font-weight: 800; font-size: 24px;
  transition: transform .12s ease, border-color .12s ease, background .12s ease, box-shadow .12s ease;
  touch-action: manipulation; display: grid; place-items: center; padding: 10px 8px;
}
.ans.kana { font-family: var(--font-kana); font-size: 40px; font-weight: 700; }
.ans:hover:not([disabled]) { border-color: var(--ai); box-shadow: var(--shadow); transform: translateY(-2px); }
.ans .key { position: absolute; top: 5px; left: 8px; font-size: 11px; font-weight: 700; color: var(--ink-faint); }
@media (pointer: coarse) { .ans .key { display: none; } }
.ans.correct { background: var(--wakakusa-wash); border-color: var(--wakakusa); color: var(--wakakusa); }
.ans.wrong   { background: var(--shu-wash);      border-color: var(--shu);      color: var(--shu); }
.ans.dim     { opacity: .38; }
.ans[disabled]{ cursor: default; }

.typebox { display: flex; gap: 8px; }
.typebox input {
  flex: 1 1 auto; font: inherit; font-size: 22px; font-weight: 700;
  padding: 12px 16px; border-radius: var(--r-md);
  border: 2px solid var(--rule); background: var(--paper); color: var(--ink); min-width: 0;
}
.typebox input:focus { outline: none; border-color: var(--ai); }

/* ---------- progress strip ---------- */
.strip { display: flex; align-items: center; gap: 10px; }
.pips { display: flex; gap: 4px; flex: 1 1 auto; }
.pip { height: 6px; border-radius: 99px; background: var(--ground-deep); flex: 1 1 8px; max-width: 26px; }
.pip.hit  { background: var(--wakakusa); }
.pip.miss { background: var(--shu); }
.pip.now  { background: var(--ai); }
.streak { font-weight: 800; font-size: 14px; color: var(--yamabuki); white-space: nowrap; }

/* ---------- FISHING POND ---------- */
.pond {
  position: relative; height: min(54vh, 400px);
  border: 1.5px solid var(--rule); border-radius: var(--r-lg);
  background: linear-gradient(to bottom, var(--pond) 0%, var(--pond-deep) 100%);
  overflow: hidden; touch-action: manipulation;
}
.pond::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(to bottom, transparent 0 26px, rgba(255,255,255,.07) 26px 28px);
}
.fish {
  position: absolute; top: 0; left: 0;
  width: 106px; height: 56px; border: 0; background: none; padding: 0;
  will-change: transform;
}
.fish-svg { width: 100%; height: 100%; display: block; overflow: visible; }
.fish-svg .body { fill: var(--paper); stroke: var(--rule-strong); stroke-width: 2.5; }
.fish-svg .tail { fill: var(--ai); opacity: .9; }
.fish-svg .eye  { fill: var(--ink); }
.fish-label {
  position: absolute; inset: 0 0 0 24px;
  display: grid; place-items: center;
  font-family: var(--font-kana); font-weight: 700; font-size: 26px;
  color: var(--ink); pointer-events: none;
}
.fish-label.romaji { font-family: var(--font-ui); font-weight: 800; font-size: 19px; }
.fish.left .fish-svg { transform: scaleX(-1); }
.fish.left .fish-label { inset: 0 24px 0 0; }
.fish.caught { animation: caught .32s ease forwards; pointer-events: none; }
.fish.miss   { animation: missfx .32s ease forwards; pointer-events: none; }
@keyframes caught { to { transform: translate(var(--fx), calc(var(--fy) - 40px)) scale(1.35); opacity: 0; } }
@keyframes missfx { to { transform: translate(var(--fx), calc(var(--fy) + 26px)) scale(.7); opacity: 0; } }

.prompt-card {
  text-align: center; padding: 12px 18px;
  border: 1.5px solid var(--rule); background: var(--paper);
  border-radius: var(--r-lg); box-shadow: var(--shadow);
}
.prompt-big { font-size: 44px; font-weight: 800; line-height: 1.1; color: var(--ai); }
.prompt-big.kana { font-family: var(--font-kana); font-weight: 700; font-size: 54px; color: var(--ink); }
.power-row { display: flex; align-items: center; gap: 10px; }
.power-tag {
  font-size: 10.5px; font-weight: 800; letter-spacing: .13em;
  text-transform: uppercase; color: var(--ink-faint); white-space: nowrap;
}
.power-bar {
  flex: 1 1 auto; height: 16px; border-radius: 99px;
  background: var(--ground-deep); border: 1.5px solid var(--rule); overflow: hidden;
}
.power-bar i {
  display: block; height: 100%; border-radius: 99px;
  background: var(--wakakusa); transition: background .25s ease;
}
.power-bar.mid i { background: var(--yamabuki); }
.power-bar.low i { background: var(--shu); }
.power-bar.low { animation: lowpulse 1s ease-in-out infinite; }
@keyframes lowpulse { 0%,100% { opacity:1 } 50% { opacity:.55 } }
.quota {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--ai-wash); color: var(--ai);
  border-radius: 999px; padding: 6px 13px;
  font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums;
}

/* ---------- FRUIT BASKET ---------- */
.orchard { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; min-height: 92px; }
.fruit {
  position: relative; width: 78px; height: 84px;
  border: 0; background: none; padding: 0;
  touch-action: none; user-select: none;
  transition: transform .18s cubic-bezier(.2,1.3,.4,1), opacity .2s ease;
}
.fruit-svg { width: 100%; height: 100%; display: block; pointer-events: none; }
.fruit-label {
  position: absolute; inset: 14px 0 0 0; display: grid; place-items: center;
  font-family: var(--font-kana); font-weight: 700; font-size: 30px;
  color: #fff; pointer-events: none; text-shadow: 0 1px 3px rgba(0,0,0,.3);
}
.fruit-label.romaji { font-family: var(--font-ui); font-weight: 800; font-size: 20px; }
.fruit.dragging { z-index: 30; transition: none; cursor: grabbing; filter: drop-shadow(0 10px 16px rgba(0,0,0,.28)); }
.fruit.picked   { transform: translateY(-10px) scale(1.08); }
.fruit.picked .fruit-svg { filter: drop-shadow(0 0 0 2px var(--ai)); }

<script>

// rather than retyped - there is no chance of a mismatch.

  const out = {};

function unitsFromRows(rows) {
  return rows.map(function (r) { return { label: r.label, keys: r.kana.slice() }; });
}

function withKanji(items, confuse) {
  Object.keys(KANJI_ITEMS).forEach(function (k) { if (!items[k]) items[k] = KANJI_ITEMS[k]; });
  Object.keys(KANJI_CONFUSE).forEach(function (k) { if (!confuse[k]) confuse[k] = KANJI_CONFUSE[k]; });
  return items;
}

function buildKanaCourse(title, sub, rows, extraRows, romajiMap, confuse, words) {
  const items = {};
  rows.concat(extraRows).forEach(function (r) {
    r.kana.forEach(function (k) { items[k] = { jp: k, romaji: romajiMap[k] }; });
  });
  return {
    title: title, sub: sub, kind: "kana", forms: ["jp", "romaji"],
    units: unitsFromRows(rows), extraUnits: unitsFromRows(extraRows),
    items: withKanji(items, confuse), confuse: confuse, words: words || null,
    games: ["match", "pairs", "fruit", "fish"].concat(words ? ["word"] : [])
  };
}

function buildVocabCourse(title, sub, groups) {
  const items = {}, words = [];
  const units = groups.map(function (g, gi) {
    g.items.forEach(function (it) {
      items[it.jp] = { jp: it.jp, en: it.en, pic: it.pic };
      words.push({ w: it.jp, en: it.en, pic: it.pic, row: gi });
    });
    return { label: g.label, keys: g.items.map(function (it) { return it.jp; }) };
  });
  return {
    title: title, sub: sub, kind: "vocab", forms: ["jp", "en"],
    units: units, extraUnits: [], items: withKanji(items, {}), confuse: KANJI_CONFUSE, words: words,
    games: ["match", "pairs", "fruit", "word", "fish"]
  };
}

// Three forms, so a question can go hiragana -> katakana, katakana -> romaji,
// romaji -> hiragana, and every other pairing.
function buildMixCourse() {

}

// Sentence-gap items. The direction never flips: you always read the

function buildGrammarCourse(title, sub, groups) {

function courseOf(p) { return COURSES[p.course] || COURSES.hiragana; }

function prog(p) {
  if (!p.progress) p.progress = {};
  if (!p.progress[p.course]) p.progress[p.course] = { level: 0, boxes: {} };
  return p.progress[p.course];
}

function unitsOf(p) {
  const c = courseOf(p);
  return tierOf(p).dakuten ? c.units.concat(c.extraUnits) : c.units.slice();
}

function itemOf(p, key) { return courseOf(p).items[key] || {}; }

function showForm(p, key, form) {
  const it = itemOf(p, key);
  return (it && it[form] !== undefined && it[form] !== null) ? it[form] : key;
}

// Which form is the prompt and which is the answer, for one board.
function pickForms(p) {
  const lv = session && session.level;
  if (lv && lv.kind === "kanji") {
    const other = Math.random() < 0.5 ? "kana" : "en";
    return Math.random() < 0.5 ? { from: "jp", to: other } : { from: other, to: "jp" };
  }
  const lvForms = lv && lv.forms;
  const forms = lvForms || courseOf(p).forms;
  if (!lvForms && courseOf(p).fixedDirection) return { from: forms[0], to: forms[1] };
  if (forms.length <= 2) {
    return Math.random() < tierOf(p).reverse
      ? { from: forms[1], to: forms[0] }
      : { from: forms[0], to: forms[1] };
  }
  const a = Math.floor(Math.random() * forms.length);
  let b = Math.floor(Math.random() * (forms.length - 1));
  if (b >= a) b += 1;
  return { from: forms[a], to: forms[b] };
}

// A course counts as finished once its last level is passed.
function courseDone(p, id) {
  const saved = (p.progress || {})[id];
  if (!saved) return false;
  const was = p.course;
  p.course = id;
  const total = ladderFor(p).length;
  p.course = was;
  return saved.level >= total - 1;
}

function courseUnlocked(p, id) {
  const i = COURSE_ORDER.indexOf(id);
  if (i <= 0) return true;
  return courseDone(p, COURSE_ORDER[i - 1]);
}

function encodeState(data) {
  const bytes = new TextEncoder().encode(JSON.stringify(data));
  let bin = "";
  bytes.forEach(function (b) { bin += String.fromCharCode(b); });
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function decodeState(code) {
  try {
    let b64 = code.replace(/-/g, "+").replace(/_/g, "/");
    while (b64.length % 4) b64 += "=";
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return JSON.parse(new TextDecoder().decode(bytes));
  } catch (e) { return null; }
}

/* ============================================================
   4. THE LADDER
   A fixed, numbered list of levels. Learn a row, then review the rows
   just learned; the review widens 2 -> 3 -> 5 -> 10 as more rows are known.
   Every board is still five kana.
   ============================================================ */

function mixWidth(rowsKnown) {
  if (rowsKnown <= 3) return 2;
  if (rowsKnown <= 6) return 3;
  if (rowsKnown <= 9) return 5;
  return 10;
}

// The whole ladder, computed the same way every time - no randomness, so
// "Level 7" means the same thing for every player at the same tier.
// Kanji carries on from topic to topic rather than restarting, so each course
// starts where the one before it left off.
function kanjiOffset(courseId) {
  let n = 0;
  for (let i = 0; i < COURSE_ORDER.length; i++) {
    const id = COURSE_ORDER[i];
    if (id === courseId) break;
    n += Math.floor(baseLadderLength(id) / 4);
  }
  return n;
}

function baseLadderLength(courseId) {
  const c = COURSES[courseId];
  if (!c) return 0;
  const rows = c.units.length;
  return rows + Math.max(0, rows - 1);      // one learn level each, plus a review after the first
}

function ladderFor(p) {
  const rows = allRows(p);
  const base = [];
  for (let i = 0; i < rows.length; i++) {
    base.push({ kind: "learn", rows: [i] });
    const known = i + 1;
    if (known >= 2) {
      const width = Math.min(mixWidth(known), known);
      const list = [];
      for (let r = known - width; r < known; r++) list.push(r);
      base.push({ kind: "review", rows: list });
    }
  }

  // Slot a kanji level in as every fifth level.
  const out = [];
  let g = kanjiOffset(p.course);
  base.forEach(function (step) {
    out.push(step);
    if (out.length % 5 === 4) {
      out.push({ kind: "kanji", rows: [], group: g % KANJI_GROUPS.length });
      g += 1;
    }
  });
  return out;
}

function levelInfo(p) {
  const rows = allRows(p);
  const ladder = ladderFor(p);
  const idx = Math.max(0, Math.min(prog(p).level || 0, ladder.length - 1));
  const step = ladder[idx];
  const kana = [];
  if (step.kind === "kanji") {
    KANJI_KEYS[step.group].forEach(function (k) { kana.push(k); });
  } else {
    step.rows.forEach(function (r) { rows[r].keys.forEach(function (k) { kana.push(k); }); });
  }
  return {
    index: idx,
    number: idx + 1,
    total: ladder.length,
    kind: step.kind,
    rows: step.rows,
    kana: kana,
    game: gameForLevel(p, ladder, idx),
    group: step.group,
    forms: step.kind === "kanji" ? ["jp", "kana", "en"] : null,
    label: "Level " + (idx + 1),
    sub: step.kind === "kanji" ? "漢字 · " + KANJI_GROUPS[step.group].label
       : step.kind === "review" ? "Review · " + step.rows.length + " rows"
       : (courseOf(p).kind === "vocab" ? "New words"
        : courseOf(p).kind === "grammar" ? "New grammar" : "New kana")
  };
}

// How many rows the player has met so far - drives the garden and word list.
function rowsIntroduced(p) {
  const ladder = ladderFor(p);
  const idx = Math.max(0, Math.min(prog(p).level || 0, ladder.length - 1));
  let max = 1;
  for (let i = 0; i <= idx; i++) {
    ladder[i].rows.forEach(function (r) { if (r + 1 > max) max = r + 1; });
  }
  return max;
}

function levelSolid(p) {
  const info = levelInfo(p);
  if (!info.kana.length) return false;
  const solid = info.kana.filter(function (k) { return box(p, k) >= SOLID_BOX; }).length;
  return solid / info.kana.length >= 0.8;
}

// Checked when a board ends, so every level is played at least once before
// it can be passed.
function advanceLevel(p) {
  const ladder = ladderFor(p);
  if ((prog(p).level || 0) >= ladder.length - 1) return null;
  if (!levelSolid(p)) return null;
  prog(p).level = (prog(p).level || 0) + 1;
  p.stars += 5;
  return levelInfo(p);
}

// The kana a board draws from. Short rows (や行, わ行 hold three) get topped
// up from earlier rows so every board is still five.
function boardPool(p) {
  const info = levelInfo(p);
  let kana = info.kana.slice();
  if (kana.length < BOARD_SIZE) {
    const older = learnedKana(p).filter(function (k) { return kana.indexOf(k) === -1; });
    if (older.length) {
      kana = kana.concat(pickFive(p, older).slice(0, BOARD_SIZE - kana.length));
    }
  }
  return kana;
}

// The five that actually go on the board: weakest first.
function pickFive(p, kanaList) {
  const remaining = kanaList.slice();
  const chosen = [];
  const want = Math.min(BOARD_SIZE, remaining.length);
  while (chosen.length < want) {
    let total = 0;
    const weights = remaining.map(function (k) {
      const w = BOX_WEIGHT[box(p, k)] || 1;
      total += w;
      return w;
    });
    let r = Math.random() * total;
    let idx = remaining.length - 1;
    for (let i = 0; i < remaining.length; i++) {
      r -= weights[i];
      if (r <= 0) { idx = i; break; }
    }
    chosen.push(remaining.splice(idx, 1)[0]);
  }
  return chosen;
}

/* ============================================================
   5. SELECTION HELPERS
   ============================================================ */

function pick(list) { return list[Math.floor(Math.random() * list.length)]; }

// Japanese-script forms get the kana face; romaji and English get the UI face.
function withGap(text) { return esc(text).replace(/＿/g, '<span class="gap"></span>'); }
function isJpForm(form) { return form !== "romaji" && form !== "en"; }
function formClass(form) { return isJpForm(form) ? "kana" : (form === "en" ? "en" : ""); }

function shuffle(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function nextKana(p, poolList, avoid) {
  if (!poolList || !poolList.length) return "あ";
  const usable = poolList.length > 1 && avoid
    ? poolList.filter(function (k) { return k !== avoid; })
    : poolList;
  let total = 0;
  const weights = usable.map(function (k) {
    const w = BOX_WEIGHT[box(p, k)] || 1;
    total += w;
    return w;
  });
  let r = Math.random() * total;
  for (let i = 0; i < usable.length; i++) {
    r -= weights[i];
    if (r <= 0) return usable[i];
  }
  return usable[usable.length - 1];
}

// Board pool first, then everything learned, then any kana — so a 5-kana board
// can still fill six answer tiles.
function distractors(p, answer, count, poolList, form) {
  const to = form || courseOf(p).forms[1];
  const confuse = courseOf(p).confuse || {};
  const chosen = [];
  const usedSound = {};
  usedSound[showForm(p, answer, to)] = true;

  function take(source) {
    shuffle(source).forEach(function (k) {
      if (chosen.length >= count) return;
      const r = showForm(p, k, to);
      if (!r || usedSound[r]) return;      // never two tiles reading the same
      usedSound[r] = true;
      chosen.push(k);
    });
  }

  const board = (poolList || []).filter(function (k) { return k !== answer; });
  take((confuse[answer] || []).filter(function (k) { return board.indexOf(k) !== -1; }));
  take(board);
  if (chosen.length < count) {
    const learned = learnedKana(p).filter(function (k) { return k !== answer && chosen.indexOf(k) === -1; });
    take((confuse[answer] || []).filter(function (k) { return learned.indexOf(k) !== -1; }));
    take(learned);
  }
  if (chosen.length < count) {
    take(Object.keys(courseOf(p).items).filter(function (k) { return k !== answer && chosen.indexOf(k) === -1; }));
  }
  return chosen;
}

/* ============================================================
   6. AUDIO
   ============================================================ */

const audio = (function () {
  let ctx = null, primed = false;

  function tone(freq, when, dur, type, gain) {
    if (!ctx) return;
    const osc = ctx.createOscillator(), amp = ctx.createGain();
    osc.type = type || "sine";
    osc.frequency.value = freq;
    amp.gain.setValueAtTime(0.0001, ctx.currentTime + when);
    amp.gain.exponentialRampToValueAtTime(gain || 0.16, ctx.currentTime + when + 0.015);
    amp.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + when + dur);
    osc.connect(amp).connect(ctx.destination);
    osc.start(ctx.currentTime + when);
    osc.stop(ctx.currentTime + when + dur + 0.02);
  }

  return {
    prime: function () {
      if (primed) return;
      primed = true;
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) ctx = new AC();
        if (ctx && ctx.state === "suspended") ctx.resume();
      } catch (e) { ctx = null; }
    },
    good:  function () { tone(587.33, 0, .13, "sine", .14); tone(880, .09, .22, "sine", .13); },
    bad:   function () { tone(196, 0, .2, "triangle", .1); },
    star:  function () { [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) { tone(f, i * .075, .22, "sine", .12); }); },
    done:  function () { [523.25, 659.25, 783.99].forEach(function (f, i) { tone(f, i * .1, .3, "sine", .13); }); }
  };
})();

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
  });
}

function stopLoops() {
  if (session && session.raf) { cancelAnimationFrame(session.raf); session.raf = null; }
  if (session && session.powerRaf) { cancelAnimationFrame(session.powerRaf); session.powerRaf = null; }
  if (session && session.timer) { clearInterval(session.timer); session.timer = null; }
  if (session) session.ended = true;
}

/* ------------------------------------------------------------
   POWER - shared by every game. It drains the whole time you
   play, every right answer tops it up, and you pass by getting
   enough right before it empties. Slower, more thoughtful games
   drain gently; the fishing pond drains at full speed.
   ------------------------------------------------------------ */

const DRAIN_RATE = { fish: 1, match: 0.75, fruit: 0.7, word: 0.6, pairs: 0.55 };

function powerInit(p, mode) {
  const base = tierOf(p).power;
  session.cfg = {
    quota: base.quota,
    drain: base.drain * (DRAIN_RATE[mode] || 0.75),
    refill: base.refill,
    penalty: base.penalty
  };
  session.power = 100;
  session.quota = base.quota;
  session.score = 0;
  session.won = false;
  session.paused = false;
  session.ended = false;
}

function powerHUD() {
  const pct = Math.max(0, Math.min(100, session.power || 0));
  return '<div class="power-row">' +
           '<span class="power-tag">Power</span>' +
           '<span class="power-bar' + (pct <= 20 ? " low" : pct <= 50 ? " mid" : "") + '" id="powerBar">' +
             '<i id="powerFill" style="width:' + pct + '%"></i></span>' +
           '<span class="quota" id="quotaChip">' + session.score + ' / ' + session.quota + '</span>' +
         '</div>';
}

function drawPower() {
  const fill = document.getElementById("powerFill");
  if (!fill) return;
  const pct = Math.max(0, Math.min(100, session.power));
  fill.style.width = pct + "%";
  const bar = document.getElementById("powerBar");
  if (bar) bar.className = "power-bar" + (pct <= 20 ? " low" : pct <= 50 ? " mid" : "");
  const chip = document.getElementById("quotaChip");
  if (chip) chip.textContent = session.score + " / " + session.quota;
}

// Returns true when the quota is filled, so the caller can end the round.
function powerGain(p) {
  session.power = Math.min(100, session.power + session.cfg.refill);
  session.score += 1;
  drawPower();
  if (session.score >= session.quota) { session.won = true; return true; }
  return false;
}

function powerLose(p) {
  session.power = Math.max(0, session.power - session.cfg.penalty);
  drawPower();
}

function startPowerClock(p) {
  // go() runs stopLoops() on the way in, which flags the session ended;
  // clear it here so the clock that follows actually ticks.
  session.ended = false;
  let last = null;
  function tick(ts) {
    if (!session || session.ended || screen === "result" || screen === "home") return;
    if (last === null) last = ts;
    const dt = Math.min(0.05, (ts - last) / 1000);
    last = ts;
    if (!session.paused) {
      session.power -= session.cfg.drain * dt;
      drawPower();
      if (session.power <= 0) { session.power = 0; drawPower(); audio.bad(); finish(p); return; }
    }
    session.powerRaf = requestAnimationFrame(tick);
  }
  session.powerRaf = requestAnimationFrame(tick);
}

// Rotate the working five through the level, so the kana on screen keep changing.
function refreshPool(p) {
  const all = session.levelPool;
  if (all.length <= BOARD_SIZE) { session.pool = all.slice(); return; }
  let fresh = all.filter(function (k) { return session.usedThisRound.indexOf(k) === -1; });
  if (fresh.length < BOARD_SIZE) { session.usedThisRound = []; fresh = all.slice(); }
  session.pool = pickFive(p, fresh);
  session.pool.forEach(function (k) {
    if (session.usedThisRound.indexOf(k) === -1) session.usedThisRound.push(k);
  });
}

function go(name) {
  closeStudyOverlay();
  if (name !== "fish") stopLoops();
  screen = name;
  render();
  window.scrollTo(0, 0);
}

function render() {

  const p = currentProfile();
  if (screen === "profile" && !p) { renderProfileEditor(null); return; }
  if (!p) { renderHome(); return; }
  if      (screen === "menu")    renderMenu(p);
  else if (screen === "match")   renderMatch(p);
  else if (screen === "pairs")   renderPairs(p);
  else if (screen === "fruit")   renderFruit(p);
  else if (screen === "word")    renderWord(p);
  else if (screen === "fish")    renderFish(p);
  else if (screen === "garden")  renderGarden(p);
  else if (screen === "topics")  renderTopics(p);
  else if (screen === "study")   renderStudy(p);
  else if (screen === "profile") renderProfileEditor(p);
  else if (screen === "result")  renderResult(p);
  else                           renderHome();
}

// The level decides the game - the player never picks. New kana get the gentler
// games; review levels rotate through the rest so a level always feels different
// from the one before it.
const LEARN_GAMES  = ["match", "pairs", "fruit"];
const REVIEW_GAMES = ["word", "fish", "fruit", "pairs", "match"];
const KANJI_GAMES  = ["match", "pairs", "fish", "fruit"];

// Walk the whole ladder once so a game is never assigned twice in a row.
function gamesForLadder(p, ladder) {
  const tierModes = tierOf(p).modes;
  const courseGames = courseOf(p).games;
  const seen = { learn: 0, review: 0 };
  const out = [];
  let rowsKnown = 0;

  for (let i = 0; i < ladder.length; i++) {
    const step = ladder[i];
    step.rows.forEach(function (r) { if (r + 1 > rowsKnown) rowsKnown = r + 1; });
    const list = step.kind === "kanji" ? KANJI_GAMES
               : step.kind === "learn" ? LEARN_GAMES : REVIEW_GAMES;
    const allowed = step.kind === "kanji"
      ? tierModes
      : tierModes.filter(function (g) { return courseGames.indexOf(g) !== -1; });
    if (seen[step.kind] === undefined) seen[step.kind] = 0;
    const ord = seen[step.kind]++;
    let chosen = null;

    // First pass refuses a repeat of the previous level; second pass relents
    // if the tier leaves no other option.
    for (let pass = 0; pass < 2 && !chosen; pass++) {
      for (let n = 0; n < list.length; n++) {
        const g = list[(ord + n) % list.length];
        if (allowed.indexOf(g) === -1) continue;                 // tier does not have it
        const meta = MODE_META[g];
        if (meta.minRows && rowsKnown < meta.minRows) continue;   // not enough kana yet
        if (pass === 0 && i > 0 && g === out[i - 1]) continue;
        chosen = g;
        break;
      }
    }
    out.push(chosen || "match");
  }
  return out;
}

function gameForLevel(p, ladder, idx) {
  return gamesForLadder(p, ladder)[idx] || "match";
}

function startLevel(p) {
